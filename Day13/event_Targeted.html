// sequence of handling the events

<html>
    <head>
        Event Propagation
    </head>
    <style>
        #id1{
            background-color: beige;
            padding:20px;
            border:1px solid peru

        }
        #id2{
            background-color: blue;
            padding:20px;
            border:1px solid rgb(221, 210, 198)

        }
        #id3{
            background-color: violet;
            padding:20px;
            border:1px solid white

        }
    </style>
    <body>
        <h1>
            Event Targeting
        </h1>
        <div id="id1">Division1
            <div id="id2">Division2
                <div id="id3">Division3</div>
            </div>
        </div>

        <script>
            const div1=document.getElementById("id1");
            const div2=document.getElementById("id2");
            const div3=document.getElementById("id3");

            div1.addEventListener("click", function(event){
                alert("Division1 is clicked");
                event.stopPropagation();
            });
             div2.addEventListener("click", function(event){
                alert("Division2 is clicked");
                event.stopPropagation();
            });
            div3.addEventListener("click", function(event){
                alert("Division3 is clicked");
                event.stopPropagation();

            });
        </script>
    </body>
</html>
