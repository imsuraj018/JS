<!DOCTYPE html>
<html>
    <head>
        <title>Event Handler</title>

    </head>
    <body>
        <button onclick="alert('Inline HTML handler')"></button>
        <p id="id1"><i>Moonlight, starlight</i></p>

        <script>
            let para=document.getElementById("id1");
            para.onmouseover=()=>{
                para.style.color="purple";
                para.addEventListener("mouseout", ()=>{
                    para.style.color="red";
                });
            }
        </script>
    </body>
</html>
